on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The new version to tag, ex: 1.0.5'
        required: true
        type: string

name: Continuous integration

env:
  SWIFT_VERSION: 6.4.0

jobs:
  build:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: xcode-27
          - name: ubuntu-22.04
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: "List Xcode versions"
      if: matrix.os == 'xcode-27'
      run: ls /Applications | grep Xcode

    - name: "Select Xcode version"
      if: matrix.os == 'xcode-27'
      run: sudo xcode-select -s /Applications/Xcode_27.0.app

    - name: "Print Xcode version"
      if: matrix.os == 'xcode-27'
      run: xcodebuild -version

    - name: "Install build dependencies"
      if: matrix.os == 'xcode-27'
      run: brew install ninja

    - name: "Install build dependencies"
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt install -y ninja-build
        python3 -m pip install 'cmake>=3.28'

    - name: Set up Swift
      if: matrix.os == 'ubuntu-22.04'
      run: |
        swift_toolchain="swift-${SWIFT_VERSION}-RELEASE-ubuntu22.04"
        curl -fL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2204/swift-${SWIFT_VERSION}-RELEASE/${swift_toolchain}.tar.gz" -o "$RUNNER_TEMP/swift.tar.gz"
        tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$swift_toolchain/usr/bin" >> "$GITHUB_PATH"

    - name: Restore build cache
      id: build-cache
      uses: actions/cache/restore@v4
      with:
        path: build
        key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('CMakeLists.txt', '.github/workflows/test.yml') }}

    - name: "index-import: CMake"
      env:
        CC: clang
        CXX: clang++
      run: |
        if [[ "$RUNNER_OS" == macOS ]]; then
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DLLVM_TARGETS_TO_BUILD=AArch64
        else
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD=X86
        fi

    - name: "index-import: Build"
      run: cmake --build build

    - name: Save build cache
      if: steps.build-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: build
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    - name: "index-import: test"
      run: cmake --build build --target check-index-import

    - name: "index-import: archive"
      run: |
        cd build
        COPYFILE_DISABLE=1 tar czvf index-import.tar.gz absolute-unit index-import

    - name: "index-import: upload"
      uses: actions/upload-artifact@v4
      with:
        name: index-import-${{ runner.os }}
        path: |
          build/index-import.tar.gz
          build/llvm-revision.txt

  create-release:
    name: Create release
    needs: build
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Download index-import artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: index-import-*
        path: artifacts

    - name: Create release
      run: |
        set -euo pipefail

        macos_archive="index-import.tar.gz"
        linux_archive="index-import-linux-x86_64.tar.gz"
        mv "artifacts/index-import-macOS/index-import.tar.gz" "$macos_archive"
        mv "artifacts/index-import-Linux/index-import.tar.gz" "$linux_archive"
        llvm_revision=$(cat artifacts/index-import-macOS/llvm-revision.txt)
        swift_version=${llvm_revision#swift-}
        swift_version=${swift_version%-RELEASE}
        ./.github/generate-notes.sh "$swift_version" "$macos_archive" "$linux_archive" | tee notes.md
        gh release create "$TAG" --title "$TAG" --target "$GITHUB_REF_NAME" --notes-file notes.md "$macos_archive" "$linux_archive"
      env:
        TAG: ${{ inputs.tag }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # For local development, use the playground at
  # https://rhysd.github.io/actionlint/
  actionlint:
    name: Actionlint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
        with:
          shellcheck: false
